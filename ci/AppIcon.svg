<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191c"/>
      <stop offset="0.52" stop-color="#050607"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="silver" x1="0.12" y1="0.08" x2="0.86" y2="0.92">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#f5f7f8"/>
      <stop offset="0.42" stop-color="#9ba2a8"/>
      <stop offset="0.62" stop-color="#f8f9fa"/>
      <stop offset="0.82" stop-color="#8f969c"/>
      <stop offset="1" stop-color="#f4f6f7"/>
    </linearGradient>
    <linearGradient id="checkSilver" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#eef0f2"/>
      <stop offset="0.72" stop-color="#9da4aa"/>
      <stop offset="1" stop-color="#f7f8f9"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.75  0 1 0 0 0.78  0 0 1 0 0.82  0 0 0 0.42 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#000000"/>
  <rect x="42" y="42" width="940" height="940" rx="205" fill="url(#bg)" stroke="#242a2e" stroke-width="2"/>

  <g filter="url(#shadow)">
    <circle cx="512" cy="500" r="334" fill="none" stroke="#727a81" stroke-opacity="0.28" stroke-width="86"/>
    <circle cx="512" cy="500" r="334" fill="none" stroke="url(#silver)" stroke-width="72" filter="url(#softGlow)"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M350 505 L474 629 L700 395" fill="none" stroke="#7b838a" stroke-opacity="0.34" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M350 495 L474 619 L700 385" fill="none" stroke="url(#checkSilver)" stroke-width="82" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  </g>
</svg>
